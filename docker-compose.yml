version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1a38y6
      POSTGRES_DB: MptRoom
    volumes:
      - ./mptroom_dump.sql:/docker-entrypoint-initdb.d/mptroom_dump.sql
    networks:
      - app-network

  backend:
    container_name: backend
    build:
      context: ./Backend/MptRoomAPI  # Путь к папке с проектом
      dockerfile: MptRoomAPI/Dockerfile  # Указываем путь к Dockerfile внутри Backend/MptRoomAPI
    ports:
      - "5198:5198"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MptRoom;Username=postgres;Password=1a38y6;
      - ASPNETCORE_URLS=http://+:5198
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend/MptRoomFrontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - 80
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
