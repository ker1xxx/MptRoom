<div class="modal-backdrop">
    <div class="modal-content" (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
        [class.dragging]="isDragging">

        <h3>Изменение аватарки</h3>

        <div class="drag-drop-zone" (click)="fileInput.click()">
            <input #fileInput type="file" class="file-input" (change)="onFileSelected($event)" accept="image/*">
            <div class="zone-content">
                <i class="upload-icon"></i>
                <div class="instructions" *ngIf="!croppedImage">
                    <h3>Перетащите изображение сюда</h3>
                    <p>или нажмите для выбора</p>
                    <div class="formats">Поддерживаются форматы: PNG, JPG, JPEG</div>
                </div>
                <div *ngIf="croppedImage">
                    <img [src]="croppedImage" class="preview" />
                </div>
            </div>
        </div>

        <image-cropper *ngIf="imageChangedEvent" [imageChangedEvent]="imageChangedEvent" [maintainAspectRatio]="true"
            [aspectRatio]="1" [resizeToWidth]="200" format="jpeg" (imageCropped)="imageCropped($event)">
        </image-cropper>

        <button (click)="uploadAvatar()">Сохранить</button>
        <button (click)="close.emit()">Отмена</button>
    </div>
</div>
