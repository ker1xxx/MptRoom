<div class="recent-mark-card">
    <div class="side-bar" [style.backgroundColor]="sidebar_color">
    </div>
    <div class="main-block">
        <div class="light-text task-name">
            {{subject_name}}
        </div>
        <div class="mark-info-block">
            <div class="task-name-text">
                {{task_name}}
            </div>
            <div style="grid-row: 3/4;">
                {{due_date}}
            </div>
        </div>
    </div>
    <div class="mark-card" [ngClass]="status">
        {{mark}}
    </div>
</div>
