<admin-header></admin-header>

<div class="p-6">
    <h1 class="text-2xl font-bold mb-4">Посты</h1>

    <!-- Фильтрация -->
    <div class="mb-4 flex gap-4">
        <div>
            <label class="block mb-1">Тема</label>
            <select [(ngModel)]="filter.themeId" (ngModelChange)="applyFilters()" class="w-full p-2 border rounded">
                <option value="">Все темы</option>
                <option *ngFor="let theme of themes" [value]="theme.postThemeId">{{ theme.postThemeText }}</option>
            </select>
        </div>
        <div>
            <label class="block mb-1">Автор</label>
            <select [(ngModel)]="filter.authorId" (ngModelChange)="applyFilters()" class="w-full p-2 border rounded">
                <option value="">Все авторы</option>
                <option *ngFor="let author of authors" [value]="author.personalDataId">
                    {{ author.lastname }} {{ author.name }}
                </option>
            </select>
        </div>
        <div>
            <label class="block mb-1">Курс</label>
            <select [(ngModel)]="filter.courseId" (ngModelChange)="applyFilters()" class="w-full p-2 border rounded">
                <option value="">Все курсы</option>
                <option *ngFor="let course of courseForDisplay" [value]="course.courseId">
                    {{ course.courseName }}
                </option>
            </select>
        </div>
        <div>
            <label class="block mb-1">Группа</label>
            <select [(ngModel)]="filter.groupId" (ngModelChange)="applyFilters()" class="w-full p-2 border rounded">
                <option value="">Все группы</option>
                <option *ngFor="let c of groups" [value]="c.groupId">
                    {{ c.groupName }}
                </option>
            </select>
        </div>
        <div>
            <label class="block mb-1">Предмет</label>
            <select [(ngModel)]="filter.courseId" (ngModelChange)="applyFilters()" class="w-full p-2 border rounded">
                <option value="">Все предметы</option>
                <option *ngFor="let subject of subjects" [value]="subject.subjectId">
                    {{ subject.subjectName }}
                </option>
            </select>
        </div>
    </div>

    <button (click)="openModal()" class="mb-4 px-4 py-2 bg-green-500 text-white rounded">
        + Добавить пост
    </button>

    <!-- Таблица -->
    <table class="w-full border">
        <thead>
            <tr class="bg-gray-200">
                <th class="p-2">ID</th>
                <th class="p-2">Заголовок</th>
                <th class="p-2">Тема</th>
                <th class="p-2">Тип</th>
                <th class="p-2">Дата</th>
                <th class="p-2">Автор</th>
                <th class="p-2">Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let post of filteredPosts" class="border-t cursor-pointer" (click)="openModal(post)">
                <td class="p-2">{{ post.id }}</td>
                <td class="p-2">{{ post.title }}</td>
                <td class="p-2">{{ post.theme }}</td>
                <td class="p-2">{{ post.type }}</td>
                <td class="p-2">{{ post.date }}</td>
                <td class="p-2">{{ post.author }}</td>
                <td class="p-2 flex gap-2">
                    <button (click)="deletePost(post.id)"
                        class="bg-red-500 text-white px-2 py-1 rounded">Удалить</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Модальное окно -->
<div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-10">
    <div class="bg-white p-6 rounded-lg w-96">
        <h2 class="text-xl mb-4">{{ isEditMode ? 'Редактировать' : 'Создать' }} пост</h2>
        <form (ngSubmit)="savePost()">
            <div class="mb-4">
                <label class="block mb-1">Заголовок</label>
                <input [(ngModel)]="selectedPost.postTitle" name="title" required class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Описание</label>
                <textarea [(ngModel)]="selectedPost.postDescription" name="description" rows="4"
                    class="w-full p-2 border rounded" required></textarea>
            </div>
            <div class="mb-4">
                <label class="block mb-1">Тип</label>
                <select [(ngModel)]="selectedPost.postType" name="type" required class="w-full p-2 border rounded">
                    <option *ngFor="let type of PostTypes" [value]="type.value">{{ type.label }}</option>
                </select>
            </div>
            <label class="block mb-1">Тема</label>

            <select [(ngModel)]="selectedThemeOption" (change)="onThemeChange()" class="border p-2 rounded w-full mb-3">
                <option *ngIf="themes?.length === 0" disabled>Нет доступных тем</option>
                <option *ngFor="let theme of themes" [value]="theme.postThemeId">
                    {{ theme.postThemeText }}
                </option>
                <option [value]="-1">+ Новая тема</option>
            </select>

            <!-- Поле для новой темы -->
            <div *ngIf="selectedThemeOption === '-1'" class="mb-4">
                <label class="block mb-1">Введите название новой темы</label>
                <input type="text" [(ngModel)]="newThemeName" class="border p-2 rounded w-full mb-3" />
            </div>

            <div class="mb-4">
                <label class="block mb-1">Курс</label>
                <select [(ngModel)]="selectedPost.courseId" name="courseId" required class="w-full p-2 border rounded">
                    <option *ngFor="let course of courseForDisplay" [value]="course.courseId">{{ course.courseName }}
                    </option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block mb-1">Автор</label>
                <select [(ngModel)]="selectedPost.userId" name="userId" required class="w-full p-2 border rounded">
                    <option *ngFor="let author of authors" [value]="author.personalDataId">
                        {{ author.lastname }} {{ author.name }}
                    </option>
                </select>
            </div>
            <div class="flex justify-between gap-2">
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">
                    {{ isEditMode ? 'Сохранить' : 'Создать' }}
                </button>
                <button type="button" (click)="closeModal()"
                    class="px-4 py-2 bg-gray-500 text-white rounded">Отмена</button>
            </div>
        </form>
    </div>
</div>
