<admin-header></admin-header>
<div class="p-6">
    <h1 class="text-2xl font-bold mb-4">Предметы</h1>

    <button (click)="openModal()" class="mb-4 px-4 py-2 bg-green-500 text-white rounded">
        + Добавить предмет
    </button>

    <table class="w-full border">
        <thead>
            <tr class="bg-gray-200">
                <th class="p-2">ID</th>
                <th class="p-2">Название</th>
                <th class="p-2">Цвет</th>
                <th class="p-2">Действия</th>
            </tr>
        </thead>
        <tbody style="width: 100%;">
            <tr *ngFor="let subject of subjects" class="cursor-pointer border-t text-center width-100"
                (click)="openModal(subject)">
                <td class=" p-2 text-center">{{ subject.subjectId }}</td>
                <td class="p-2 text-center">{{ subject.subjectName }}</td>
                <td class="p-2 text-center">
                    <div class="w-6 h-6 rounded" [style.background]="subject.hexademicalColor"></div>
                </td>
                <td class="p-2 text-center flex gap-2">
                    <button (click)="deleteSubject(subject.subjectId!)"
                        class="bg-red-500 text-white text-center px-2 py-1 rounded">Удалить</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Модалка -->
<div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-10">
    <div class="bg-white p-6 rounded-lg w-96">
        <h2 class="text-xl mb-4">{{ isEditMode ? 'Редактировать' : 'Создать' }} предмет</h2>
        <form (ngSubmit)="saveSubject()">
            <div class="mb-4">
                <label class="block mb-1">Название</label>
                <input [(ngModel)]="selectedSubject!.subjectName" name="subjectName" required
                    class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Цвет</label>
                <input type="color" [(ngModel)]="selectedSubject!.hexademicalColor" name="hexColor"
                    class="w-full p-2 border rounded" />
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" (click)="closeModal()"
                    class="px-4 py-2 bg-gray-500 text-white rounded">Отмена</button>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">
                    {{ isEditMode ? 'Сохранить' : 'Создать' }}
                </button>
            </div>
        </form>
    </div>
</div>
