<admin-header></admin-header>
<div class="p-6">
    <h1 class="text-2xl font-bold mb-4">Преподаватели</h1>

    <button (click)="openModal()" class="mb-4 px-4 py-2 bg-green-500 text-white rounded">
        + Добавить преподавателя
    </button>

    <table class="w-full border">
        <thead>
            <tr class="bg-gray-200">
                <th class="p-2">ID</th>
                <th class="p-2">ФИО</th>
                <th class="p-2">Телефон</th>
                <th class="p-2">Email</th>
                <th class="p-2">Предметы</th>
                <th class="p-2">Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let teacher of teachers" class="border-t cursor-pointer" (click)="openModal(teacher)">
                <td class="p-2 text-center">{{ teacher.userId }}</td>
                <td class="p-2 text-center">{{ teacher.lastname }} {{ teacher.name }} {{ teacher.patronymic }}</td>
                <td class="p-2 text-center">{{ teacher.phoneNumber }}</td>
                <td class="p-2 text-center">{{ teacher.email }}</td>
                <td class="p-2 text-center gap-2 flexflex-wrap">
                    <span *ngFor="let subject of teacher.subjects"
                        class="flex items-center gap-1 bg-gray-100 px-2 py-1 rounded text-sm">
                        <span class="w-3 h-3 rounded" [style.background]="subject.hexademicalColor"></span>
                        {{ subject.subjectName }}
                    </span>
                </td>
                <td class="p-2 flex flex-wrap gap-2 text-center">
                    <button (click)="deleteTeacher(teacher.userId)"
                        class="bg-red-500 text-white px-2 py-1 rounded">Удалить</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Модалка -->
<div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-10">
    <div class="bg-white p-6 rounded-lg w-96">
        <h2 class="text-xl mb-4">{{ isEditMode ? 'Редактировать' : 'Создать' }} преподавателя</h2>
        <form (ngSubmit)="saveTeacher()">
            <div class="mb-4">
                <label class="block mb-1">Имя</label>
                <input [(ngModel)]="selectedTeacher!.name" name="name" required class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Фамилия</label>
                <input [(ngModel)]="selectedTeacher!.lastname" name="lastname" required
                    class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Отчество</label>
                <input [(ngModel)]="selectedTeacher!.patronymic" name="patronymic" class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Телефон</label>
                <input [(ngModel)]="selectedTeacher!.phoneNumber" name="phoneNumber"
                    class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Email</label>
                <input [(ngModel)]="selectedTeacher!.email" name="email" type="email"
                    class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Логин</label>
                <input [(ngModel)]="selectedTeacher!.login" name="login" required class="w-full p-2 border rounded" />
            </div>
            <div class="mb-4" *ngIf="!isEditMode">
                <label class="block mb-1">Пароль</label>
                <input [(ngModel)]="selectedTeacher!.password" name="password" type="password"
                    class="w-full p-2 border rounded" />
            </div>

            <!-- Кнопки перехода -->
            <div *ngIf="isEditMode" class="flex justify-between gap-2 mb-4">
                <button type="button" (click)="showCourses(selectedTeacher?.userId)"
                    class="flex-1 bg-purple-500 text-white py-2 rounded">Курсы</button>
                <button type="button" class="flex-1 bg-indigo-500 text-white py-2 rounded">Материалы</button>
                <button type="button" class="flex-1 bg-pink-500 text-white py-2 rounded">Посты</button>
            </div>

            <div class="flex justify-end gap-2">
                <button type="button" (click)="closeModal()"
                    class="px-4 py-2 bg-gray-500 text-white rounded">Отмена</button>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">
                    {{ isEditMode ? 'Сохранить' : 'Создать' }}
                </button>
            </div>
        </form>
    </div>
</div>
