<div *ngFor="let material of additionalMaterials$" class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 ease-out 
              border border-gray-100 relative group overflow-hidden">

    <!-- Content -->
    <div (click)="openPreview(material.additionalMaterialId!, material.uriAbsolutePath)"
        class="cursor-pointer p-4 pr-10 hover:bg-gray-50 transition-colors">
        <div class="flex items-start gap-3">
            <!-- File Icon -->
            <div class="w-10 h-10 flex items-center justify-center bg-purple-100 rounded-lg">
                <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>

            <!-- File Info -->
            <div class="flex-1 min-w-0">
                <p class="text-gray-800 font-semibold truncate text-base">
                    {{ getFileName(material.uriAbsolutePath) || 'Неизвестное имя файла' }}
                </p>
                <p class="text-sm text-gray-500 mt-1">Нажмите для просмотра</p>
            </div>
        </div>
    </div>

    <!-- Delete Button -->
    <button (click)="removeFileFromServer(material.additionalMaterialId!)" class="absolute top-3 right-3 p-1.5 hover:bg-red-50 rounded-full 
                   transition-colors duration-200 opacity-0 group-hover:opacity-100">
        <svg class="w-5 h-5 text-red-500 hover:text-red-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
    </button>

    <!-- Hover Effect -->
    <div class="absolute inset-0 border-2 border-transparent group-hover:border-purple-100 
                transition-all duration-300 pointer-events-none rounded-xl"></div>
</div>

<!-- Модалка предпросмотра -->
<teacher-preview-modal *ngIf="selectedFileId" [fileId]="selectedFileId">
</teacher-preview-modal>
