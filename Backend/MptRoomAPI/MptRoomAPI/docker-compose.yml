version: '3.9'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    restart: always
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "15000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    restart: always
    networks:
      - monitoring

  influxdb:
    image: influxdb:latest
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
      - ect_influxdb2_data:/etc/influxdb
    restart: always
    networks:
      - monitoring

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    depends_on: 
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/rootfs/sys:ro
      - /proc:/rootfs/proc:ro
      - /etc:/rootfs/etc:ro
    environment:
      HOST_PROC: /rootfs/proc
      HOST_SYS: /rootfs/sys
      HOST_ETC: /rootfs/etc
    privileged: true
    restart: always
    networks:
      - monitoring

networks:
  monitoring:

volumes:
  grafana_data:
  ect_influxdb2_data:
  influxdb_data:
