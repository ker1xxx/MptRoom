version: '3.9'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    restart: always
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "15000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    restart: always
    networks:
      - monitoring

networks:
  monitoring:

volumes:
  grafana_data:
  ect_influxdb2_data:
  influxdb_data:
